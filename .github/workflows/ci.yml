# Use Arch to test build outside of Ubuntu/Pop.
#
# Tests with recent version of dependencies. Another testson a different
# distro could be used to test for lowest supported.
#
# A minimal image should also help to confirm what dependencies are needed.

name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:
  schedule:
    - cron: '0 7 * * *' # Midnight MST daily

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  Test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      volumes:
        - /:/host
    steps:
    - run: >
        pacman --noconfirm --needed -Syu
        cargo
        clang
        desktop-file-utils
        git
        gtk3
        gtk4
        just
        libdisplay-info
        libinput
        libxkbcommon
        llvm
        mesa
        meson
        pipewire
        pulseaudio
        seatd
        wayland
        lld
        expat
        fontconfig
        freetype2
        flatpak
        nasm
    - run: rm -rf /host/usr/local/lib/android # Free space
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        submodules: recursive
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      continue-on-error: true
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
    - run: git config --global --add safe.directory '*'
    - run: just sysext
